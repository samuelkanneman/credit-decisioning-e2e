[project]
name = "decision-service"
version = "0.1.0"
description = "Decision service: calls the scoring API, evaluates the credit policy, records the decision"
requires-python = ">=3.12,<3.13"
dependencies = [
    "credit-score",
    "fastapi>=0.115",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "uvicorn>=0.30",
    "zen-engine>=0.40",
]

[tool.uv.sources]
credit-score = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decision_service"]
