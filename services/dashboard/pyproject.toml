[project]
name = "dashboard"
version = "0.1.0"
description = "Monitoring dashboard: stability, performance, policy and operations"
requires-python = ">=3.12,<3.13"
dependencies = [
    "credit-score",
    "numpy>=2.0",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "streamlit>=1.40",
]

[tool.uv.sources]
credit-score = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dashboard"]
