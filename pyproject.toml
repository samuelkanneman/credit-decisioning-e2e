[project]
name = "credit-score"
version = "0.0.1"
description = "End-to-end credit decisioning system on public Lending Club data"
requires-python = ">=3.12,<3.13"
# The core package is pure Python so the scoring API can install it without the
# training stack. Everything heavy lives in the `train` group.
dependencies = []

[dependency-groups]
train = [
    "lightgbm>=4.5",
    "mlflow>=3.0",
    "numpy>=2.0",
    "optbinning>=1.0",
    "pandas>=2.2",
    "pandera[pandas]>=0.26",
    "pyarrow>=17",
    "statsmodels>=0.14",
]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
    "dashboard",
    "decision-service",
    "score-api",
]
load = [
    "locust>=2.30",
]
data = [
    "requests>=2.32",
]

[tool.uv]
default-groups = ["dev", "train"]

[tool.uv.workspace]
members = ["services/*"]

[tool.uv.sources]
score-api = { workspace = true }
decision-service = { workspace = true }
dashboard = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_score"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
