services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: credit
      POSTGRES_PASSWORD: credit  # local demo only
      POSTGRES_DB: credit
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credit -d credit"]
      interval: 3s
      timeout: 3s
      retries: 20

  score-api:
    build:
      context: .
      dockerfile: services/score_api/Dockerfile
    environment:
      DATABASE_URL: postgresql://credit:credit@postgres:5432/credit
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  decision-service:
    build:
      context: .
      dockerfile: services/decision_service/Dockerfile
    environment:
      DATABASE_URL: postgresql://credit:credit@postgres:5432/credit
      SCORE_API_URL: http://score-api:8000
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      score-api:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: services/dashboard/Dockerfile
    environment:
      DATABASE_URL: postgresql://credit:credit@postgres:5432/credit
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
