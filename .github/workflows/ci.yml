name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make lint
      - run: make test
      - name: Full pipeline on synthetic data
        run: make demo

  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images and start the stack
        run: make up
      - name: Smoke test
        run: make smoke
      - name: Requests were logged to PostgreSQL
        run: |
          rows=$(docker compose exec -T postgres psql -U credit -d credit -tAc "select count(*) from score_log")
          test "$rows" -eq 20
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
