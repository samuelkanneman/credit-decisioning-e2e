name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make lint
      - run: make test
      - name: Full pipeline on synthetic data
        run: make demo
      - name: Impact of policy changes
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          uv run python -m credit_score.policy_diff --base FETCH_HEAD --out policy_impact.md
          cat policy_impact.md >> "$GITHUB_STEP_SUMMARY"

  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Build images and start the stack
        run: make up
      - name: Smoke test
        run: make smoke
      - name: Scores and decisions were logged to PostgreSQL
        run: |
          q() { docker compose exec -T postgres psql -U credit -d credit -tAc "$1"; }
          test "$(q 'select count(*) from score_log')" -eq 40
          test "$(q 'select count(*) from decision_log')" -eq 20
          test "$(q "select count(distinct decision) from decision_log")" -eq 3
      - name: Replay synthetic 2017 traffic and run the monitoring job
        run: |
          make demo
          make simulate PROCESSED=build/demo/processed FRACTION=0.2
          make monitor PROCESSED=build/demo/processed REPORT=build/monitoring_report.md
          test "$(docker compose exec -T postgres psql -U credit -d credit -tAc \
            "select count(*) from loan_outcomes")" -gt 100
          cat build/monitoring_report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Dashboard is up
        run: curl -fsS http://127.0.0.1:8501/_stcore/health
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
